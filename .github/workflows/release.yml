name: release

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  create-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build release archive
        id: archive
        env:
          RELEASE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        shell: bash
        run: |
          tag="v${RELEASE_RUN_NUMBER}"
          package_dir="numis-${tag}"

          mkdir "$package_dir"
          git archive HEAD | tar -x -C "$package_dir"

          composer install \
            --working-dir="$package_dir" \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

          npm install --prefix "$package_dir" --no-audit --no-fund
          npm run build --prefix "$package_dir"
          rm -rf "$package_dir/node_modules"

          archive="${package_dir}.zip"
          (
            cd "$package_dir"
            zip -qr "../$archive" . -x ".env"
          )
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.archive.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
            --target "$HEAD_SHA" \
            --title "Numis $RELEASE_TAG" \
            --generate-notes
